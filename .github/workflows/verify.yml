name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 誤変換 / 配色 119 項目 / サイトの構造 210 項目 / 作用素 90 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap の lastmod を git の記録と突き合わせるため、履歴が要る。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 依存パッケージなし。npm install も要らない。
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - name: 配色の読みやすさ
        run: node verification/check_contrast.js
      - name: サイトの構造
        run: node verification/check_site.js
      - name: 作用素の数値（NumPy の記録との突き合わせ）
        run: node verification/check_trinity.js
