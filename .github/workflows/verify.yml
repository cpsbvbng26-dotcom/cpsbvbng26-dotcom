name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読むだけでよい。書き込む仕事は無い。
permissions:
  contents: read

jobs:
  verify:
    name: 誤変換 / 配色 702 項目 / サイトの構造 946 項目 / 作用素 90 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # sitemap の lastmod を git の記録と突き合わせるため、履歴が要る。
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # 依存パッケージなし。npm install も要らない。
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - name: 配色の読みやすさ
        run: node verification/check_contrast.js
      - name: サイトの構造
        run: node verification/check_site.js
      - name: 作用素の数値（NumPy の記録との突き合わせ）
        run: node verification/check_trinity.js
      - name: 秘密情報と個人の連絡先
        run: node verification/check_secrets.js
      - name: 秘密情報の検査を壊して確かめる
        run: node verification/check_secrets.js --break
      # 検査そのものを壊して、壊した箇所がちょうど落ちることを確かめる。
      # 通ることでは信用できないので、ここを最後に置く。
      - name: 検査そのものを壊して確かめる
        run: node verification/check_guards.js

  # ブラウザが要る検査は別の仕事にする。**環境の都合で落ちたのか、中身が
  # 壊れたのかを見分けられなくなる**ので、上の並びには混ぜない。
  keyboard:
    name: キーボードで辿れるか 718 項目
    # ubuntu-latest が 26.04 になり、playwright 1.56.1 が Chromium を入れられなくなった（2026-11-06）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: playwright と Chromium を入れる
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tab で辿って測る
        run: NODE_PATH="$(npm root -g)" node verification/check_keyboard.js
