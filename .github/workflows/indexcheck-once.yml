name: index check (one-off)
on:
  push:
    branches: ['claude/linkcheck-run-1111']
    paths: ['.indexcheck/run.js']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .indexcheck/run.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .indexcheck/result.json && git commit -m "index check result" && git push
