name: doi-index-check

on:
  push:
    paths: [ 'doi-index-check/**', '.github/workflows/doi-index-check.yml' ]
  pull_request:
    paths: [ 'doi-index-check/**', '.github/workflows/doi-index-check.yml' ]

permissions:
  contents: read

jobs:
  verify:
    name: 道具自身 52 項目 / 壊す先 33 通り
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: doi-index-check }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '20' }
      # **外へ出ない。**見本だけで回る。出たら検査が落ちる。
      - run: node verification/check_tool.js
      - run: node verification/check_tool.js --break
