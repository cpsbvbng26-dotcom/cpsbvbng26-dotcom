name: 公開中のサイト

# 公開中のサイト（https://cpsbvbng26-dotcom.vercel.app/）が main と同じものを配っているかを、ファイルごとにバイト単位で比べる
# （tools/live.js。比べるファイルは tools/live.json）。main への push のあとは、デプロイを最大 10 分待つ。
# ワークフローの push はほかのワークフローを起こさないので、毎日も一度比べる。違いが残れば issue を開き、一致すればひとりでに閉じる。
# tools/live.js は、ほかのリポジトリの同じ名のファイルと一字一句同じで、check_ecosystem.js が見る（2026-11-15）。
on:
  push:
    branches: [main]
  schedule:
    - cron: '53 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    name: 公開中のサイトが main と同じか
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node tools/live.js
        env:
          WAIT: ${{ github.event_name == 'push' && '600' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
