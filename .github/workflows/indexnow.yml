name: IndexNow

# sitemap.xml が変わった push のあと、変わった頁と消えた頁を IndexNow に知らせる。
# 鍵はリポジトリの根の <鍵>.txt で、秘密ではない。Google は IndexNow を読まず、sitemap を読む。

on:
  push:
    branches: [main]
    paths: [sitemap.xml]
  workflow_dispatch:
    inputs:
      all:
        description: sitemap の頁を全部送る（yes / no）
        required: false
        default: 'no'

permissions:
  contents: read

jobs:
  indexnow:
    name: 変わった頁を IndexNow に知らせる
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 前の head の sitemap を履歴から読む。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node verification/indexnow.js
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
