name: 索引の網羅調査

# 月に一度、DOI の一覧（docs/doi-index.md）の番号を、公開の索引に当てる。
# 当てる先は OpenAlex・Semantic Scholar・OpenAIRE・OpenCitations と、著者の側の ORCID・Wikidata・DataCite。
# DOAPR は検索の頁ではなく、GitHub の antleaf/doapr と申請の issue（#105）で見る。
# 結果は Actions の要約と成果物に残す。main には書かない。
# 2026-11-11 まで、使い捨ての枝（claude/linkcheck-run-1111）で一度だけ回していた。

on:
  schedule:
    - cron: '23 4 9 * *'
  workflow_dispatch:

# 読むだけ。GITHUB_TOKEN は antleaf/doapr の issue とコードの検索を読むのに使う。
permissions:
  contents: read

jobs:
  survey:
    name: 索引の網羅調査（月に一度）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: 判定の部品を確かめる（外へ出ない）
        run: node verification/index_survey.js --self-test
      - name: 索引に当てる
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node verification/index_survey.js --out index-survey.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: index-survey
          path: index-survey.json
          retention-days: 90
