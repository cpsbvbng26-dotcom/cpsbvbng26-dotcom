name: 外の値

# 週に一度、外の場の値を読み、控え（verification/outside.json）と比べる。
# 見るのは三つ。ORCID の作品の数、OpenAlex の著者の ID の数、Zenodo の七つの記録の要旨。
# 違えば issue を一つ立てるか直す。同じに戻れば閉じる。CI は落とさない。

on:
  schedule:
    - cron: '47 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: 外の値の見張り（週に一度）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: 比べる部品を確かめる（外へ出ない）
        run: node verification/watch_outside.js --self-test
      - name: 読んで比べる
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_ISSUE: '1'
        run: node verification/watch_outside.js
