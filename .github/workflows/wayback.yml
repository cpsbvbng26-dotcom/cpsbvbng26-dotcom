name: Wayback Machine に写しを残す

# 手で起こすときだけ動く。作業環境からは web.archive.org に届かないので、
# GitHub の実行環境から Save Page Now に頼む。
# 頼むのは sitemap.xml の頁と、論文の頁から張っている PDF の実体（raw）である。
# 頼んだあと、その日付の写しが実際にあるかを確かめる。
# 確かめられたものだけを「残った」として要約に出す。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    name: 頁と PDF の写しを頼み、残ったことを確かめる
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 頼む
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, time, urllib.error, urllib.parse, urllib.request

          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          pdfs = set()
          for f in glob.glob("papers/*.html"):
              for u in re.findall(r'href="(https://github\.com/[^"]+\.pdf)"', open(f, encoding="utf-8").read()):
                  pdfs.add(u.replace("https://github.com/", "https://raw.githubusercontent.com/")
                            .replace("/blob/", "/", 1))
          urls += sorted(pdfs)
          today = time.strftime("%Y%m%d", time.gmtime())
          ua = {"User-Agent": "cpsbvbng26-dotcom wayback workflow"}

          def get(u, timeout=120):
              with urllib.request.urlopen(urllib.request.Request(u, headers=ua), timeout=timeout) as r:
                  return r.status, r.read()

          def snapshot(u):
              api = "https://archive.org/wayback/available?timestamp=%s&url=%s" % (today, urllib.parse.quote(u, safe=""))
              try:
                  c = json.loads(get(api, 60)[1]).get("archived_snapshots", {}).get("closest")
              except Exception:
                  return None
              return c["url"] if c and c.get("available") and c["timestamp"].startswith(today) else None

          done, failed = [], []
          for u in urls:
              for wait in (0, 60, 180):
                  time.sleep(wait)
                  try:
                      get("https://web.archive.org/save/" + u)
                      break
                  except urllib.error.HTTPError as e:
                      if e.code != 429:
                          break
                  except Exception:
                      break
              time.sleep(20)
              s = snapshot(u)
              (done if s else failed).append((u, s))
              print(("残った  " if s else "見えない ") + u)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("残ったもの %d / 頼んだもの %d\n\n" % (len(done), len(urls)))
              for u, s in done:
                  f.write("- %s\n  %s\n" % (u, s))
              if failed:
                  f.write("\n今日の写しが見えなかったもの（取り込みが遅れているだけのこともある）\n\n")
                  for u, _ in failed:
                      f.write("- %s\n" % u)
          EOF
