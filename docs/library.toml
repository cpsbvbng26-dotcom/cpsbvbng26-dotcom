# 参考文献の一覧。Zotero などに読み込ませる docs/library.bib の生成元。
#
#     python3 verification/build_library.py で library.bib を作り直す
#     python3 verification/build_library.py --check で、作り直したものと一致するかを見る
#
# library.bib は生成物です。手で直さない（決めごと 3）。直すのはこのファイルです。
#
# status は三つだけ使う。
#
#   照合済み      論文の草稿で、モデルを介した読みにより原典と照らした（草稿の開示のとおり）
#   原典未確認    書誌は標準的なものを書いたが、著者はまだ原典に当たっていない
#   未参照        文献の側の帰属として挙げるだけで、中身には何も拠らない
#
# DOI は、草稿で照合した番号だけを書く。ほかは空けておく（決めごと 1）。
# 哲学三篇の参考文献（autonomy-and-self-cultivation の references.toml）は、
# 紙面の文字列のまま @misc として足す。そちらは構造化しない。書誌を足せば、
# 確かめていない書誌を作ることになるからです。

