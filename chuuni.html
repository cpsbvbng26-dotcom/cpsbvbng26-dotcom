<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var LEVEL_NAMES = ['', '素の中学生', '目覚めかけ', '発症', '重症', '臨界突破'];
  var COUNTS = ['10', '30', '50', '100', '300'];
  var state = { kind: 'skill', level: 3, count: 30, seed: '' };
  var current = null;

  /* ---------- お気に入り ---------- */
  var FAV_KEY = 'chuuni-favorites';
  var FAV_MAX = 300;
  var favs = loadFavs();
  var viewingFavs = false;

  function loadFavs() {
    try {
      var raw = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
      return Object.prototype.toString.call(raw) === '[object Array]' ? raw : [];
    } catch (e) { return []; }
  }

  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
    catch (e) { toast('保存できませんでした'); }
  }

  function favKey(item) { return item.kind + '\u0000' + item.head + '\u0000' + (item.body || ''); }

  function favIndex(item) {
    var key = favKey(item);
    for (var i = 0; i < favs.length; i++) if (favKey(favs[i]) === key) return i;
    return -1;
  }

  function toggleFav(item) {
    var at = favIndex(item);
    if (at >= 0) {
      favs.splice(at, 1);
    } else {
      favs.unshift({ kind: item.kind, label: item.label, head: item.head, latin: item.latin, body: item.body });
      if (favs.length > FAV_MAX) favs.length = FAV_MAX;
    }
    saveFavs();
    paintFavButton();
    return at < 0;
  }

  function paintFavButton() {
    var b = $('favView');
    b.textContent = '★ お気に入り' + (favs.length ? '（' + favs.length + '）' : '');
    b.setAttribute('aria-pressed', String(viewingFavs));
  }

  /* ---------- タブ ---------- */
  var kindsEl = $('kinds');
  CHUUNI.KINDS.forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.dataset.kind = k.id;
    b.textContent = k.label;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-controls', 'out');
    b.addEventListener('click', function () {
      select(k.id);
    });
    b.addEventListener('keydown', function (e) {
      var step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!step) return;
      e.preventDefault();
      var tabs = Array.prototype.slice.call(kindsEl.children);
      var next = tabs[(tabs.indexOf(this) + step + tabs.length) % tabs.length];
      next.focus();
      select(next.dataset.kind);
    });
    kindsEl.appendChild(b);
  });

  function select(kind) {
    state.kind = kind;
    paintTabs();
    run();
  }

  function paintTabs() {
    Array.prototype.forEach.call(kindsEl.children, function (b) {
      var on = b.dataset.kind === state.kind;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
    });
  }

  /* ---------- URL ハッシュ ---------- */
  function readHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    h.split('&').forEach(function (pair) {
      var kv = pair.split('=');
      var k = decodeURIComponent(kv[0] || '');
      var v = decodeURIComponent(kv[1] || '');
      if (k === 'kind' && CHUUNI.KINDS.some(function (x) { return x.id === v; })) state.kind = v;
      if (k === 'level') state.level = clamp(parseInt(v, 10), 1, 5, 3);
      if (k === 'count') state.count = clamp(parseInt(v, 10), 1, 300, 30);
      if (k === 'seed') state.seed = v;
    });
  }

  function clamp(n, lo, hi, fallback) {
    if (isNaN(n)) return fallback;
    return Math.min(hi, Math.max(lo, n));
  }

  function writeHash() {
    history.replaceState(null, '',
      '#kind=' + state.kind + '&level=' + state.level +
      '&count=' + state.count + '&seed=' + encodeURIComponent(state.seed));
  }

  /* ---------- 描画 ---------- */
  function render(items, metaText) {
    var frag = document.createDocumentFragment();

    items.forEach(function (item, i) {
      var card = el('article', 'card');
      card.style.setProperty('--i', String(Math.min(i, 14)));

      var top = el('div', 'card-top');
      top.appendChild(text(el('span', 'chip'), item.label));

      var right = el('div', 'right');
      right.appendChild(text(el('span', 'idx'), '#' + (i + 1)));

      var star = text(el('button', 'star'), favIndex(item) >= 0 ? '★' : '☆');
      star.type = 'button';
      star.title = 'お気に入りに入れる';
      star.setAttribute('aria-label', 'お気に入りに入れる');
      star.setAttribute('aria-pressed', String(favIndex(item) >= 0));
      star.addEventListener('click', function () {
        var added = toggleFav(item);
        star.textContent = added ? '★' : '☆';
        star.setAttribute('aria-pressed', String(added));
        toast(added ? 'お気に入りに入れました' : 'お気に入りから外しました');
        if (viewingFavs) showFavorites();
      });
      right.appendChild(star);
      top.appendChild(right);
      card.appendChild(top);

      var head = el('div', 'head serif');
      head.innerHTML = CHUUNI.toHtml(item.head);
      card.appendChild(head);

      if (item.latin) card.appendChild(text(el('div', 'latin'), item.latin));

      if (item.body) {
        var body = el('div', 'body serif body--' + item.kind);
        if (item.kind === 'profile') {
          body.appendChild(profileFields(item.body));
        } else {
          body.innerHTML = CHUUNI.toHtml(item.body);
        }
        card.appendChild(body);
      }

      var copy = text(el('button', 'copy'), 'コピー');
      copy.type = 'button';
      copy.addEventListener('click', function () { copyText(CHUUNI.itemToText(item)); });
      card.appendChild(copy);

      frag.appendChild(card);
    });

    var out = $('out');
    out.textContent = '';
    if (!items.length) {
      out.appendChild(text(el('p', 'empty'), 'まだお気に入りがありません。カード右上の ☆ を押すと、ここに残ります。'));
    } else {
      out.appendChild(frag);
    }

    $('meta').textContent = metaText;
  }

  function showFavorites() {
    viewingFavs = true;
    paintFavButton();
    render(favs, favs.length ? 'お気に入り ' + favs.length + ' 件' : 'お気に入り');
  }

  /* 「項目 : 内容」の各行を、桁の揃った定義リストに組み直す */
  function profileFields(bodyText) {
    var dl = el('dl', 'profile-fields');
    bodyText.split('\n').forEach(function (line) {
      var at = line.indexOf(':');
      if (at === -1) return;
      dl.appendChild(text(document.createElement('dt'), line.slice(0, at).trim()));
      var dd = document.createElement('dd');
      dd.innerHTML = CHUUNI.toHtml(line.slice(at + 1).trim());
      dl.appendChild(dd);
    });
    return dl;
  }

  function el(tag, cls) { var e = document.createElement(tag); e.className = cls; return e; }
  function text(e, s) { e.textContent = s; return e; }

  function run() {
    state.level = clamp(parseInt($('level').value, 10), 1, 5, 3);
    state.count = clamp(parseInt($('count').value, 10), 1, 300, 30);
    state.seed = $('seed').value.trim();
    if (!state.seed) {
      state.seed = CHUUNI.randomSeed();
      $('seed').value = state.seed;
    }
    current = CHUUNI.generate(state);
    viewingFavs = false;
    paintFavButton();
    render(current.items, current.items.length + ' 件 ／ 厨二力 Lv.' + current.level +
      '（' + LEVEL_NAMES[current.level] + '） ／ seed: ' + current.seed);
    writeHash();
  }

  /* ---------- コピー・保存 ---------- */
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(toast.id);
    toast.id = setTimeout(function () { t.style.opacity = '0'; }, 1800);
  }

  function copyText(str) {
    var ok = function () { toast('コピーしました'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(ok, function () { fallbackCopy(str, ok); });
    } else {
      fallbackCopy(str, ok);
    }
  }

  function fallbackCopy(str, ok) {
    var ta = document.createElement('textarea');
    ta.value = str;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); ok(); }
    catch (e) { toast('コピーできませんでした'); }
    document.body.removeChild(ta);
  }

  function download(filename, str, mime) {
    var url = URL.createObjectURL(new Blob([str], { type: mime + ';charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('保存しました');
  }

  function jsonOf(result) {
    return JSON.stringify({
      seed: result.seed,
      level: result.level,
      kind: result.kind,
      items: result.items.map(function (it) {
        return {
          kind: it.kind,
          label: it.label,
          head: CHUUNI.toPlain(it.head),
          latin: it.latin,
          body: it.body ? CHUUNI.toPlain(it.body) : ''
        };
      })
    }, null, 2);
  }

  /* ---------- イベント ---------- */
  $('level').addEventListener('input', function () {
    var v = clamp(parseInt(this.value, 10), 1, 5, 3);
    $('levelText').textContent = 'Lv.' + v + ' ' + LEVEL_NAMES[v];
  });
  $('level').addEventListener('change', run);
  $('count').addEventListener('change', run);
  $('go').addEventListener('click', run);
  $('dice').addEventListener('click', function () {
    $('seed').value = CHUUNI.randomSeed();
    run();
  });
  $('seed').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); run(); }
  });
  $('favView').addEventListener('click', function () {
    if (viewingFavs) { run(); } else { showFavorites(); }
  });

  function shown() {
    return viewingFavs
      ? { seed: 'favorites', level: state.level, kind: 'favorites', items: favs }
      : current;
  }

  $('copyAll').addEventListener('click', function () {
    var r = shown();
    if (r && r.items.length) copyText(CHUUNI.resultToText(r));
  });
  $('dlTxt').addEventListener('click', function () {
    var r = shown();
    if (r && r.items.length) download('chuuni-' + r.seed + '.txt', CHUUNI.resultToText(r), 'text/plain');
  });
  $('dlJson').addEventListener('click', function () {
    var r = shown();
    if (r && r.items.length) download('chuuni-' + r.seed + '.json', jsonOf(r), 'application/json');
  });

  /* ---------- 起動 ---------- */
  readHash();
  $('level').value = String(state.level);
  $('levelText').textContent = 'Lv.' + state.level + ' ' + LEVEL_NAMES[state.level];
  if (COUNTS.indexOf(String(state.count)) === -1) {
    var opt = document.createElement('option');
    opt.textContent = String(state.count);
    $('count').appendChild(opt);
  }
  $('count').value = String(state.count);
  $('seed').value = state.seed;
  paintTabs();
  paintFavButton();
  run();
})();
</script>
</body>
</html>
