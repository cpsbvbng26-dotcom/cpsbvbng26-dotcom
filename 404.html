<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | 厨二病ジェネレーター</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cpsbvbng26-dotcom/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#09090b">
<style>
:root { --bg:#09090b; --text:#e4e4e7; --muted:#a1a1aa; --violet-deep:#7c3aed; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: grid; place-items: center; text-align: center;
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.7;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(60rem 32rem at 50% -12rem, rgba(124,58,237,.22), transparent 70%);
}
.wrap { position: relative; z-index: 1; padding: 2rem 1.25rem; max-width: 34rem; }
.code {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(3rem, 12vw, 5rem); font-weight: 700; margin: 0 0 .5rem;
  background: linear-gradient(115deg, #c4b5fd, #f0abfc 45%, #fb7185);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(167,139,250,.3));
}
h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .75rem; }
p { color: var(--muted); font-size: .92rem; margin: 0 0 2rem; }
a.cta {
  display: inline-block; padding: .8rem 2rem;
  color: #fff; text-decoration: none; font-weight: 600;
  border-radius: 1rem;
  background: linear-gradient(100deg, var(--violet-deep), #e11d48);
  box-shadow: 0 12px 32px -12px rgba(124,58,237,.85);
}
a.cta:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>その封印は、この世に存在しない</h1>
    <p>お探しのページは見つかりませんでした。<br>URL が変更されたか、削除された可能性があります。</p>
    <a class="cta" href="/cpsbvbng26-dotcom/">トップへ戻る</a>
  </div>
</body>
</html>
