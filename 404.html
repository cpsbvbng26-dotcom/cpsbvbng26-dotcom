<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません | 根本卓哉</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cpsbvbng26-dotcom/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#faf9f7">
<style>
:root { --bg:#faf9f7; --text:#17171a; --muted:#63636b; --line:#e6e4df; --accent:#8a6a3d; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121214; --text:#ececee; --muted:#9c9ca4; --line:#2a2a2d; --accent:#b08d57; }
}
html { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: grid; place-items: center; text-align: center;
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.85;
}
.wrap { padding: 2rem 1.5rem; max-width: 30rem; }
.code {
  font-family: Georgia, "Times New Roman", serif;
  font-size: .78rem; letter-spacing: .3em; color: var(--accent);
  margin: 0 0 1.5rem;
}
h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  font-size: 1.5rem; font-weight: 600; letter-spacing: .04em;
  margin: 0 0 .75rem;
}
p { margin: 0 0 2.5rem; color: var(--muted); font-size: .9rem; }
a {
  display: inline-block; padding: .7rem 1.6rem;
  color: inherit; text-decoration: none; font-size: .88rem;
  border: 1px solid var(--line); border-radius: 999px;
  transition: border-color .2s;
}
a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">ERROR 404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>
    <a href="/cpsbvbng26-dotcom/">トップへ戻る</a>
  </div>
</body>
</html>
